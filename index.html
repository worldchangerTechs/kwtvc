<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Kajiado West TVC</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<div class="auth-split">
  <div class="auth-side">
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-card-header">
        <img class="auth-logo" src="assets/logo.png" alt="Kajiado West TVC crest" width="72" height="72">
        <h1 class="auth-title">Kajiado West TVC</h1>
        <div class="auth-subtitle">Student Portal</div>
      </div>

      <div class="role-switch" role="tablist" aria-label="Account type">
        <button type="button" class="role-btn active" id="btn-role-student" role="tab" aria-selected="true">Student</button>
        <button type="button" class="role-btn" id="btn-role-admin" role="tab" aria-selected="false">Staff</button>
      </div>

      <div class="auth-alert" id="auth-alert" role="alert">
        <span id="auth-alert-message"></span>
      </div>

      <form id="login-form" novalidate>
        <input type="hidden" id="login-role" value="student">

        <div class="form-group">
          <label class="form-label" for="login-identifier" id="identifier-label">Admission number</label>
          <input type="text" class="form-control" id="login-identifier" name="identifier" autocomplete="username" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" class="form-control" id="login-password" name="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle-btn" id="password-toggle" aria-label="Show password">
              <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Sign in</button>
      </form>

      <div class="auth-card-footer" id="student-register-footer">
        No account? <a href="register.html">Register</a>
      </div>
    </div>
  </main>

  <footer class="portal-footer">
    <div class="footer-primary">Kajiado West Technical and Vocational College, Ngong</div>
  </footer>
  </div>
</div>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
